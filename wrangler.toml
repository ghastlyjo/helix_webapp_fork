name ="helix-webapp-fork"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Frontend build output (Vite)
[assets]
directory = "./build"
not_found_handling = "single-page-application"

# --- Bindings ---
# 1. R2 = ملفاتك الـ .md بدل القرص المحلي
[[r2_buckets]]
binding = "VAULT"
bucket_name = "helixnotes-vault"

# 2. D1 = البحث والـ index بدل Tantivy
[[d1_databases]]
binding = "DB"
database_name = "helixnotes-db"
database_id = "0ce3a10f-f265-404d-872c-f0ce11776417" # بتجيبه بعد wrangler d1 create

# 3. KV = إعداداتك الخاصة (ثيم، خط، scale)
[[kv_namespaces]]
binding = "SETTINGS"
id = "7cab3536b72140dc877576503e0e9f86"

[vars]
APP_NAME = "HelixNotes Cloud"

# ...
[observability]
enabled = false
# ...

